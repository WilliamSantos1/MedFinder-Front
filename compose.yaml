services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: medfinder
      POSTGRES_USER: medfinder
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U medfinder -d medfinder']
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  app:
    build: .
    env_file: .env
    environment:
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://medfinder:${POSTGRES_PASSWORD}@db:5432/medfinder
    ports:
      - '127.0.0.1:3001:3001'
    depends_on:
      db:
        condition: service_healthy
    command: ['sh', '-c', 'node build/scripts/manage.js migrate && node build/server/index.js']
    restart: unless-stopped
volumes:
  postgres-data:
